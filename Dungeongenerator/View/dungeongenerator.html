<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="docTitle">Map generator</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗺️</text></svg>">
  <script type="module" crossorigin src="../../assets/generator-BIQlrxVq.js"></script>
  <link rel="stylesheet" crossorigin href="../../assets/generator-BqddaJeJ.css">
</head>

<body>

    <div class="container">
        <div class="header-row">
            <h1 data-i18n="title">Dungeon Generátor</h1>
            <div class="lang-selector">
                <button id="btn-hu" type="button">HU</button>
                <button id="btn-en" type="button">EN</button>
                <button id="btn-de" type="button">DE</button>
                <button id="btn-es" type="button">ES</button>
                <button id="btn-fr" type="button">FR</button>
            </div>
        </div>

        <canvas id="dungeon"></canvas>

        <div class="controls-wrapper">
            <!-- Eltüntethető generáló beállítások -->
            <button type="button" id="toggle-settings-btn" class="settings-toggle-btn">
                <span data-i18n="settingsToggle">⚙️ Generáló Beállítások</span>
                <span>▼</span>
            </button>
            
            <div id="settings-container" class="collapsible-content">
                <div class="control-group">
                    <div class="control-row">
                        <label for="dungeon-width" data-i18n="widthLabel">Térkép szélessége:</label>
                        <input type="number" id="dungeon-width" value="50" min="20" max="200">
                    </div>
                    <div class="control-row">
                        <label for="dungeon-height" data-i18n="heightLabel">Térkép magassága:</label>
                        <input type="number" id="dungeon-height" value="50" min="20" max="200">
                    </div>
                    <div class="control-row">
                        <label for="room-count" data-i18n="roomCountLabel">Szobák száma:</label>
                        <input type="number" id="room-count" value="30" min="0" max="100">
                    </div>
                </div>
                <button id="generateBtn" class="btn-primary" data-i18n="generateBtn">🎲 Dungeon Generálása</button>
                <button id="resizeBtn" class="btn-secondary" data-i18n="resizeBtn">📐 Csak átméretezés</button>            </div>

            <!-- Módválasztó gombok -->
            <div class="tool-mode-selector" style="margin-top: 5px;">
                <button id="btn-mode-draw" class="btn-draw-active" data-i18n="modeDraw">🖌️ Csempézés</button>
                <button id="btn-mode-door" class="btn-inactive" data-i18n="modeDoor">🚪 Ajtó szerkesztés</button>
            </div>

            <!-- Rajzolási opciók -->
            <div class="control-group" id="brush-size-group">
                <div class="control-row">
                    <p data-i18n="brushSize">Ecset méret:</p>
                    <input type="number" id="brush_size" value="0" min="0">
                </div>
                <div class="control-row">
                    <label for="wall-style-select" data-i18n="wallStyleLabel">Falstílus:</label>
                    <select id="wall-style-select" style="width: 130px; padding: 4px;">
                        <option value="rocky" data-i18n="wallStyleRocky">Barlangos</option>
                        <option value="smooth" data-i18n="wallStyleSmooth">Lekerekített</option>
                    </select>
                </div>
            </div>
            
            <!-- Dinamikus Csempetípus Vezérlők (alapból megnyitva/renderelve) -->
            <div id="tile-controls-container"></div>
            
            <button id="addTileBtn" data-i18n="addTileBtn">+ Új csempe típus hozzáadása</button>
        </div>
        
        <div class="file-input-wrapper">
            <label for="map-file-input" data-i18n="mapFileLabel">Térkép vagy háttér betöltése</label>
            <input type="file" id="map-file-input" accept="image/*,.dd2vtt" style="width: 100%;">
        </div>
        
        <button id="exportBtn" data-i18n="exportBtn">Exportálás DD2VTT-be</button>
    </div>

</body>

</html>
