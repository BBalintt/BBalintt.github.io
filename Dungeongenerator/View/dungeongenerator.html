<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="docTitle">Map generator</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗺️</text></svg>">
    <link rel="stylesheet" href="../View/style.css">
</head>

<body>

    <div class="container">
        <div class="header-row">
            <h1 data-i18n="title">Dungeon Generátor</h1>
            <div class="lang-selector">
                <button id="btn-hu" type="button">HU</button>
                <button id="btn-en" type="button">EN</button>
                <button id="btn-de" type="button">DE</button>
                <button id="btn-es" type="button">ES</button>
                <button id="btn-fr" type="button">FR</button>
            </div>
        </div>

        <canvas id="dungeon"></canvas>

        <div class="controls-wrapper">
            <!-- ÚJ: Módválasztó gombok (Csempézés vs Ajtó szerkesztés) -->
            <div id="tool-mode-selector" style="margin-bottom: 12px; display: flex; gap: 8px;">
                <button id="btn-mode-draw" style="flex: 1; background: #4CAF50; color: white; padding: 8px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">🖌️ Csempézés</button>
                <button id="btn-mode-door" style="flex: 1; background: #ddd; color: black; padding: 8px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">🚪 Ajtó szerkesztés</button>
            </div>

            <div class="control-row">
                <p data-i18n="brushSize">Ecset méret:</p>
                <input type="number" id="brush_size" value="0" min="0">
            </div>

            <!-- Falstílus választó -->
            <div class="control-row" style="margin-top: 10px; display: flex; align-items: center; justify-content: space-between;">
                <label for="wall-style-select" style="font-size: 14px; font-weight: bold;" data-i18n="wallStyleLabel">Falstílus:</label>
                <select id="wall-style-select" style="padding: 4px; border-radius: 4px;">
                    <option value="rocky">Barlangos (Rocky)</option>
                    <option value="smooth">Lekerekített (Smooth)</option>
                </select>
            </div>
            
            <!-- Dinamikus Csempetípus Vezérlők -->
            <div id="tile-controls-container"></div>
            
            <button id="addTileBtn" data-i18n="addTileBtn" style="margin-top: 10px;">+ Új csempe típus hozzáadása</button>
        </div>
        <div style="margin-bottom: 10px;">
            <label for="map-file-input" style="font-size: 14px; font-weight: bold; display: block; margin-bottom: 4px;" data-i18n="mapFileLabel">Térkép vagy háttér betöltése</label>
            <input type="file" id="map-file-input" accept="image/*,.dd2vtt">
        </div>
        <button id="exportBtn" data-i18n="exportBtn">Exportálás DD2VTT-be</button>
    </div>

    <script type="module" src="../Controller/generator.ts"></script>
</body>

</html>
